server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${zhuanzhuan.datasource.driver-class-name}
      url: jdbc:mysql://${zhuanzhuan.datasource.host}:${zhuanzhuan.datasource.port}/${zhuanzhuan.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${zhuanzhuan.datasource.username}
      password: ${zhuanzhuan.datasource.password}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  data:
    redis:
      host: ${zhuanzhuan.redis.host}
      port: ${zhuanzhuan.redis.port}
      database: ${zhuanzhuan.redis.database}
      timeout: ${zhuanzhuan.redis.timeout}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhuanzhuan.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com:
      zhuanzhuan:
        mapper: debug
        service: info
        controller: info

zhuanzhuan:
  jwt:
    admin-secret-key: zhuanzhuan
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: zhuanzhuan-user
    user-ttl: 7200000
    user-token-name: token

  alioss:
    endpoint: ${zhuanzhuan.alioss.endpoint}
    region: ${zhuanzhuan.alioss.region}
    bucket-name: ${zhuanzhuan.alioss.bucket-name}
  virtual-wallet:
    scheme: virtualwallet://pay
    app-id: zhuanzhuan-campus
    callback-url: http://localhost:8080/wallet/pay/callback
    return-url: zhuanzhuan://pay/result
    sign-secret: virtual-wallet-secret

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.zhuanzhuan

knife4j:
  enable: true
  setting:
    language: zh_cn
